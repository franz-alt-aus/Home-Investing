<style>
/* Layout: libro cassa a schede — barra fissa con le sezioni, contenuto su una colonna larga max 1040px, fondi in griglia. */
:root {
  --bg: #F2F4F3; --surface: #FFFFFF; --sunk: #E8ECEB; --ink: #17232A; --muted: #56656C; --line: #D4DCDD;
  --accent: #0B5F73; --accent-soft: #DCEBEE; --on-accent: #FFFFFF;
  --ok: #2B7A4B; --ok-soft: #DDEFE3; --warn: #9A5B00; --warn-soft: #F7E8CF; --bad: #B3261E; --bad-soft: #F8DEDB;
  --f-sc: #0B5F73; --f-sa: #6553A8; --f-ris: #2B7A4B; --f-acq: #A0522D; --f-via: #B07D00; --f-pro: #6E767D;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1417; --surface: #162026; --sunk: #1D2930; --ink: #E4EBED; --muted: #97A6AC; --line: #2B3940;
  --accent: #62B6CA; --accent-soft: #173A44; --on-accent: #08191E;
  --ok: #6CC28D; --ok-soft: #173326; --warn: #E3A447; --warn-soft: #3A2B12; --bad: #F08C82; --bad-soft: #3D1C19;
  --f-sc: #62B6CA; --f-sa: #A797E6; --f-ris: #6CC28D; --f-acq: #E0946A; --f-via: #E3BE50; --f-pro: #A3ABB1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1417; --surface: #162026; --sunk: #1D2930; --ink: #E4EBED; --muted: #97A6AC; --line: #2B3940;
  --accent: #62B6CA; --accent-soft: #173A44; --on-accent: #08191E;
  --ok: #6CC28D; --ok-soft: #173326; --warn: #E3A447; --warn-soft: #3A2B12; --bad: #F08C82; --bad-soft: #3D1C19;
  --f-sc: #62B6CA; --f-sa: #A797E6; --f-ris: #6CC28D; --f-acq: #E0946A; --f-via: #E3BE50; --f-pro: #A3ABB1; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.25rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 650; }
p { margin: 0; }
.num, td.n, .amount { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand small { color: var(--muted); font-size: 0.8rem; }
.role { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; padding: 8px 12px 10px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; cursor: pointer; font-weight: 500; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 96px; display: grid; gap: 22px; }
.section { display: grid; gap: 12px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 0.875rem; max-width: 68ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* cifre principali */
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { display: grid; gap: 2px; }
.kpi .lab { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.kpi .val { font-family: var(--font-num); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 0.85rem; color: var(--muted); }

/* fondi */
.funds { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.fund { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: grid; gap: 8px; border-top: 4px solid var(--fc, var(--accent)); }
.fund-name { font-family: var(--font-display); font-weight: 650; font-size: 0.95rem; }
.fund-bal { font-family: var(--font-num); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.fund-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--fc, var(--accent)); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--fc, var(--accent)); margin-right: 6px; vertical-align: 0; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }

.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--sunk); font-size: 0.9rem; }
.alert.bad { background: var(--bad-soft); }
.alert.warn { background: var(--warn-soft); }
.alert.ok { background: var(--ok-soft); }
.alert b { font-weight: 650; }

/* tabelle */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--sunk); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 650; background: var(--sunk); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
.pos { color: var(--ok); }
.neg { color: var(--ink); }
.red { color: var(--bad); }

/* lista movimenti */
.mlist { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mrow { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; cursor: pointer; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--sunk); }
.mrow[disabled] { cursor: default; }
.mrow .d { font-family: var(--font-num); font-size: 0.8rem; color: var(--muted); }
.mrow .t { min-width: 0; }
.mrow .t div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .t div + div { font-size: 0.78rem; color: var(--muted); }
.mrow .a { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mhead { padding: 8px 12px; background: var(--sunk); font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; text-transform: capitalize; }

/* form */
label.f { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); min-width: 0; }
label.f > span { font-weight: 600; }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); min-width: 0; }
input.money { font-family: var(--font-num); text-align: right; }
textarea { min-height: 64px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 0.8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 0.85rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.errors { color: var(--bad); font-size: 0.85rem; display: grid; gap: 2px; }

.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; border-radius: 999px; padding: 12px 18px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }

/* overlay */
.overlay { position: fixed; inset: 0; background: rgba(10, 20, 24, 0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px 16px 20px; display: grid; gap: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 14px; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-size: 0.9rem; max-width: calc(100% - 32px); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.steps { display: grid; gap: 14px; counter-reset: st; }
.step { display: grid; gap: 10px; grid-template-columns: 30px 1fr; }
.step > .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; font-family: var(--font-display); }
.step > div { min-width: 0; display: grid; gap: 8px; }
.ai-out { white-space: pre-wrap; background: var(--sunk); border-radius: 8px; padding: 12px; font-size: 0.9rem; line-height: 1.55; }
.minibar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; }
.minibar.over { background: var(--bad); }
.legend { font-size: 0.8rem; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<div id="login" hidden></div>
<div id="app"><main><div class="empty"><h2>Carico il conto comune…</h2><p>Fondi, movimenti e chiusure arrivano tra un attimo.</p></div></main></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== PONTE FIREBASE =====
   L'app è nata su claude.ai e chiede i suoi servizi con window.claude.use(nome).
   Qui gli stessi servizi sono forniti da Firebase: database (Firestore), utente (login Google), download. */
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cfg = window.FIREBASE_CONFIG || {}; const acc = window.ACCESSO || { modifica: [], lettura: [] };
  const low = a => (a || []).map(x => String(x).toLowerCase().trim());
  const editori = low(acc.modifica), lettori = low(acc.lettura).concat(editori);
  const configurato = cfg.apiKey && !/INCOLLA/i.test(cfg.apiKey) && typeof firebase !== 'undefined';
  window.FB = { configurato, utente: null };
  const box = () => document.getElementById('login');
  function mostra(html) { const b = box(); b.innerHTML = `<div class="overlay" style="align-items:center"><div class="sheet" style="max-width:420px;border-radius:14px">${html}</div></div>`; b.hidden = false; }
  if (!configurato) { window.claude = { use: async () => null }; return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(); const fs = firebase.firestore();
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => { }); } catch (e) { }
  window.FB.fs = fs; window.FB.auth = auth;
  window.FB.esci = () => auth.signOut().then(() => location.reload());
  let pronto; const utenteOk = new Promise(r => { pronto = r; });
  function chiediLogin(msg) {
    mostra(`<h2>Conto comune F&amp;G</h2><p class="hint">${msg || 'Accedi con l\'account Google autorizzato.'}</p>
      <button class="btn primary" id="btnLogin" style="width:100%;padding:12px">Accedi con Google</button>`);
    document.getElementById('btnLogin').onclick = async () => {
      const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
      try { await auth.signInWithPopup(prov); }
      catch (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request')) auth.signInWithRedirect(prov);
        else if (e && e.code === 'auth/unauthorized-domain') chiediLogin('Questo indirizzo non è ancora autorizzato in Firebase: aggiungilo in Authentication → Impostazioni → Domini autorizzati (passo 3 della guida).');
        else if (e && e.code !== 'auth/popup-closed-by-user') chiediLogin('Accesso non riuscito (' + esc(e.code || e.message) + '). Riprova.');
      }
    };
  }
  auth.getRedirectResult().catch(() => { });
  auth.onAuthStateChanged(u => {
    if (!u) { chiediLogin(); return; }
    const email = String(u.email || '').toLowerCase();
    if (!lettori.includes(email)) { auth.signOut(); chiediLogin(`L'account ${esc(u.email)} non è autorizzato. Esci da Google o scegli l'altro account.`); return; }
    box().hidden = true; box().innerHTML = ''; window.FB.utente = u; pronto(u);
  });
  const db = { doc: p => fs.doc(p), collection: c => fs.collection(c) };
  const downloads = { save: async ({ filename, data }) => {
    const blob = new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } };
  window.claude = { use: async n => {
    const u = await utenteOk;
    if (n === 'db') return db;
    if (n === 'user') return { can: async () => editori.includes(String(u.email || '').toLowerCase()) };
    if (n === 'downloads') return downloads;
    return null; /* "sample" (analisi con Claude) non esiste fuori da claude.ai */
  } };
  /* import del backup JSON scaricato dall'app su claude.ai (o da questa) */
  window.FB.importaBackup = async (B) => {
    if (!B || !B.parametri || !Array.isArray(B.movimenti)) throw new Error('Il file non sembra un backup dell\'app.');
    const ops = [];
    ops.push(['config/params', B.parametri]);
    if (B.import) ops.push(['config/import', B.import]);
    B.movimenti.forEach(m => { const d = Object.assign({}, m); const id = d.id; delete d.id; if (id) ops.push(['movimenti/' + id, d]); });
    Object.entries(B.chiusure || {}).forEach(([k, v]) => ops.push(['chiusure/' + k, v]));
    for (let i = 0; i < ops.length; i += 400) {
      const b = fs.batch(); ops.slice(i, i + 400).forEach(([p, d]) => b.set(fs.doc(p), d)); await b.commit();
    }
    return { movimenti: B.movimenti.length, chiusure: Object.keys(B.chiusure || {}).length };
  };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== CORE: funzioni pure (testabili) ===== */
const pad2 = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function ymOf(iso) { return iso.slice(0, 7); }
function eomISO(ym) { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad2(new Date(y, m, 0).getDate())}`; }
function addMonths(ym, k) { let [y, m] = ym.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad2(m)}`; }
function monthsBetween(a, b) { const out = []; let c = a; let guard = 0; while (c <= b && guard++ < 600) { out.push(c); c = addMonths(c, 1); } return out; }
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
function ymLabel(ym) { const [y, m] = ym.split('-').map(Number); return `${MESI[m - 1]} ${y}`; }
function dLabel(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }

function eur(c, opts = {}) {
  if (c == null || isNaN(c)) return '–';
  const s = (c / 100).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (opts.sign && c > 0 ? '+' : '') + s + ' €';
}
function eur0(c) { if (c == null || isNaN(c)) return '–'; return Math.round(c / 100).toLocaleString('it-IT') + ' €'; }

/* "1.234,56" | "-12,5" | "12.50" | "€ 1 234,00" | number -> centesimi (int) o NaN */
function parseEuro(v) {
  if (typeof v === 'number') return Math.round(v * 100);
  if (v == null) return NaN;
  let s = String(v).trim().replace(/[€\s ]/g, '').replace(/^\+/, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (s.endsWith('-')) { neg = !neg; s = s.slice(0, -1); }

function vMovimenti() {

  if (f.fondo) list = list.filter(m => m.fondo === f.fondo || m.da === f.fondo || m.verso === f.fondo || (m.tipo === 'versamento' && (m.alloc || {})[f.fondo]));

function formToMov(F) {

  if (F.tipo === 'versamento') {
    m.importo = abs; m.chi = F.chi; m.tipoVers = F.tipoVers;
    if (F.canale === 'cassa') m.canale = 'cassa';
    if (F.tipoVers === 'mensile' && F.chi) m.alloc = allocMensile(S.P, F.chi, F.canale, Number.isFinite(abs) ? abs : undefined);
    else { m.alloc = {}; for (const k in F.allocTxt) { const v = parseEuro(F.allocTxt[k]); if (Number.isFinite(v) && v) m.alloc[k] = v; } }
    const comp = parseEuro(F.compTxt); if (F.canale !== 'cassa' && Number.isFinite(comp) && comp) m.compensazione = Math.abs(comp);
  } else if (F.tipo === 'spesa' || F.tipo === 'entrata') {

  else { m.importo = abs; m.da = F.da; m.verso = F.verso; }
  return m;
}

async function readFile(file) {

}

}

function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }

  setPath(root, path, val);

  if (/^ui\.rulesDraft\.\d+\.(segno|tipo|fondo)$/.test(path)) { const r = S.ui.rulesDraft[+path.split('.')[2]]; if (path.endsWith('segno')) r.tipo = r.segno === 'entrata' ? 'versamento' : 'spesa'; if (!path.endsWith('fondo') && r.tipo === 'versamento') { delete r.fondo; delete r.voce; } r.voce = path.endsWith('fondo') ? '' : r.voce; }

document.addEventListener('input', e => { const el = e.target; if (el.matches('input[type=text],input[type=search],textarea')) { bindEl(el, false); if (el.dataset.rr) { clearTimeout(el._t); el._t = setTimeout(() => bindEl(el, true), 300); } } });

document.addEventListener('change', e => { const el = e.target; if (el.id === 'bkFile') { const f = el.files && el.files[0]; if (f) importaFileBackup(f); el.value = ''; return; } if (el.id === 'impFile') { const f = el.files && el.files[0]; if (f) readFile(f); return; } if (el.matches('input[type=text],input[type=search],textarea')) clearTimeout(el._t); bindEl(el, true); });

document.addEventListener('click', async e => {
